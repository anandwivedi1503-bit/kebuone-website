name: Send rental end reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminders for active rides ending within one hour
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set; skipping reminder job."
            exit 0
          fi
          BASE="${SITE_URL:-https://www.evuddy.com}"
          curl -fsS -X POST "$BASE/api/jobs/rental-end-reminders" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json"
